name: Backend CI

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff (Lint & Format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies & Ruff
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Check code formatting
        run: ruff format --check .

      - name: Run Ruff linter
        run: ruff check .

  mypy:
    name: Mypy (Type Check)
    runs-on: ubuntu-latest
    needs: ruff
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies & Mypy
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy pytest

      - name: Run mypy type checking
        run: mypy . --explicit-package-bases

  pytest:
    name: Pytest & Services Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: ruff
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    defaults:
      run:
        working-directory: backend
    env:
      TESTING: "true"
      ALLOW_DEV_AUTH_BYPASS: "true"
      GROQ_VISION_API_KEY: "mock_vision_key_ci"
      GROQ_TEXT_API_KEY: "mock_text_key_ci"
      MONGO_URI: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies & test tools
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio respx httpx

      - name: Run Pytest with services coverage threshold
        run: |
          pytest tests --cov=services --cov-report=term-missing --cov-report=xml --cov-fail-under=78 -v

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: backend-services-coverage
          path: backend/coverage.xml
          retention-days: 14
          if-no-files-found: ignore
