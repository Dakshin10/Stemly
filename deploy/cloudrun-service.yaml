apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stemly-backend
  labels:
    cloud.googleapis.com/location: us-central1
    app: stemly
    env: production
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "Stemly AI Backend API Service"
spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle, scale up to 10 instances under peak load
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # Maximum concurrent requests per container instance
        autoscaling.knative.dev/target: "80"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: stemly-backend-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: gcr.io/PROJECT_ID/stemly-backend:latest
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - name: http1
              containerPort: 8080

          # Non-sensitive configuration
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: "production"
            - name: GROQ_VISION_MODEL
              value: "llama-3.2-11b-vision-preview"
            - name: GROQ_TEXT_MODEL
              value: "llama-3.3-70b-versatile"
            - name: LLM_TIMEOUT_SECONDS
              value: "30.0"
            - name: LLM_MAX_RETRIES
              value: "3"
            - name: DAILY_LLM_QUOTA
              value: "50"
            - name: CORS_ORIGINS
              value: '["https://stemly.app","https://stemly-backend-hash-uc.a.run.app"]'

            # ------------------------------------------------------------------
            # SECRETS INJECTED DIRECTLY VIA GOOGLE SECRET MANAGER
            # No plaintext secret values in repositories, builds, or manifests.
            # ------------------------------------------------------------------
            - name: GROQ_VISION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stemly-groq-vision-api-key
                  key: latest
            - name: GROQ_TEXT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stemly-groq-text-api-key
                  key: latest
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: stemly-mongo-uri
                  key: latest
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: stemly-backend-sentry-dsn
                  key: latest
            - name: FIREBASE_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: stemly-firebase-credentials-json
                  key: latest

          # Startup probe to verify initialization before routing live traffic
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3

          # Liveness probe to continuously monitor container responsiveness
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
