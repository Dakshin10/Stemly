[project]
name = "stemly-backend"
version = "1.0.0"
description = "FastAPI Backend for Stemly educational mobile application"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "pydantic",
    "pydantic-settings",
    "slowapi",
    "python-json-logger",
    "sentry-sdk[fastapi]",
    "httpx",
    "groq",
    "pillow",
    "python-multipart",
    "python-dotenv",
    "motor",
    "pymongo",
    "firebase-admin",
    "certifi",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21.0",
    "httpx>=0.24",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module level import not at top of file
]

[tool.ruff.lint.isort]
known-first-party = ["core", "services", "models", "routers", "database", "prompts", "utils", "config", "auth"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
check_untyped_defs = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["."]
