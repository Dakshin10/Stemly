services:
  - type: web
    name: stemly-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: GROQ_VISION_MODEL
        value: llama-3.2-11b-vision-preview
      - key: GROQ_TEXT_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_TIMEOUT_SECONDS
        value: "30.0"
      - key: LLM_MAX_RETRIES
        value: "3"
      - key: DAILY_LLM_QUOTA
        value: "50"
      # Secrets configured securely via Render dashboard secret groups
      - key: GROQ_VISION_API_KEY
        sync: false
      - key: GROQ_TEXT_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
